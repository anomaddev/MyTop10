name: MyTop10
options:
  bundleIdPrefix: com.anomaddev
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: MyTop10/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.anomaddev.MyTop10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
targets:
  MyTop10:
    type: application
    platform: iOS
    sources:
      - path: MyTop10
    resources:
      - path: MyTop10/Resources
        excludes:
          - Info.plist
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseFunctions
      - package: supabase-swift
        product: Supabase
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: MyTop10 uses your location to pin places on your lists and notify you when you are near a Top 10 spot.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: MyTop10 needs photo access so you can set a profile picture.
        INFOPLIST_KEY_NSCameraUsageDescription: MyTop10 needs camera access so you can take a profile picture.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
